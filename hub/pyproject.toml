[project]
name = "echo-sentry-hub"
version = "0.1.0"
description = "Raspberry Pi aggregation hub: MQTT ingest, SQLite store, Teams/Power BI sinks"
requires-python = ">=3.13"
dependencies = [
    "paho-mqtt~=2.1",
    "httpx",
    "aiohttp",
    "pydantic",
    "pydantic-settings",
    "tenacity",
    "structlog",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/echo_sentry_hub"]

[project.scripts]
echo-sentry-hub = "echo_sentry_hub.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
