[project]
name = "echo-sentry-train"
version = "0.1.0"
description = "Model training, quantization, and export for Echo Sentry edge nodes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tensorflow~=2.21",
    "numpy",
    "scipy",
    "librosa",
    "soundfile",
    "scikit-learn",
    "pandas",
    "matplotlib",
    "pyyaml",
]

[dependency-groups]
dev = [
    "jupyterlab",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/echo_sentry_train"]
